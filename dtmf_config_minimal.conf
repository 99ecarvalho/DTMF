# DTMF Configuration - Minimal/Fast Mode
# For embedded or low-power systems

# Detection thresholds
min_confidence_ratio=2.0
energy_threshold=500.0

# Algorithm selection (disable expensive algorithms)
enable_fft=true
enable_goertzel=true
enable_goertzel_twist=false
enable_filterbank=false
enable_correlation=false
enable_music=false

# Performance optimization
memory_pool_size=262144
use_lookup_tables=true
enable_audio_validation=false
enable_dc_removal=false
enable_agc=false

# Reduced logging
log_level=1
