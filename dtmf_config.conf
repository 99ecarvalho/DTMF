# DTMF Configuration File
# Lines starting with # are comments
# Format: key=value

# Detection thresholds
min_confidence_ratio=2.0
energy_threshold=1000.0
twist_tolerance_db=8.0
dc_offset_threshold=1000.0
clip_threshold=30000.0
min_snr_db=10.0

# Processing parameters  
frame_size_ms=40
sample_rate=8000
fft_size=512

# Algorithm selection (true/false)
enable_fft=true
enable_goertzel=true
enable_goertzel_twist=true
enable_filterbank=true
enable_correlation=true
enable_music=true

# Performance tuning
memory_pool_size=1048576
use_lookup_tables=true
enable_audio_validation=true
enable_dc_removal=true
enable_agc=false

# Logging (0=ERROR, 1=WARNING, 2=INFO, 3=DEBUG)
log_level=2
log_to_stderr=true
# log_file=/tmp/dtmf.log

# Example configurations for different use cases:

# For low-power/embedded systems:
# enable_music=false
# enable_filterbank=false  
# memory_pool_size=262144

# For high-accuracy analysis:
# enable_audio_validation=true
# enable_dc_removal=true
# min_confidence_ratio=3.0
# log_level=3

# For noisy environments:
# twist_tolerance_db=12.0
# min_snr_db=6.0
# enable_agc=true
# log_file=/tmp/dtmf.log

